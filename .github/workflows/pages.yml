name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Prepare static site
        run: |
          node scripts/generate-seo-pages.mjs
          rm -rf _site
          mkdir _site
          cp index.html CNAME robots.txt sitemap.xml llms.txt favicon.svg _site/
          cp -R assets _site/assets
          cp -R diabetes-specialist-coimbatore _site/diabetes-specialist-coimbatore
          cp -R obesity-weight-management-coimbatore _site/obesity-weight-management-coimbatore
          cp -R thyroid-specialist-coimbatore _site/thyroid-specialist-coimbatore
          cp -R pcos-pcod-pmos-endocrinologist-coimbatore _site/pcos-pcod-pmos-endocrinologist-coimbatore
          cp -R osteoporosis-metabolic-bone-disorders-coimbatore _site/osteoporosis-metabolic-bone-disorders-coimbatore
          cp -R adrenal-parathyroid-disorders-coimbatore _site/adrenal-parathyroid-disorders-coimbatore
          cp -R ai-in-endocrinology _site/ai-in-endocrinology
          cp -R publications _site/publications
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
